name: verify

on:
  push:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify single program kernel
        run: |
          test -s solution_0_kernel.sh
          test "$(wc -c < solution_0_kernel.sh)" -le 2048
          sh solution_0_kernel.sh "Save only P. Everything else is replayable." 16 64 > /tmp/kernel.out
          test -s solution_0_kernel.body
          test -s solution_0_kernel.clcert
          python3 - <<'PY'
          import json
          d=json.load(open("solution_0_kernel.clcert"))
          assert d["P"]=="solution_0_kernel.sh"
          assert d["STATE"]=="SOLVED"
          assert d["PERSIST"]==d["PERMA"]==d["OP"]==d["FIX"]==d["ABS"]==d["PCC"]==d["ZE"]==1
          assert d["BUG"]==0 and d["CT"]==1
          assert d["B0"]["SELF"][0]==1
          assert d["B0"]["PERSIST"]["ONE"]==1
          assert d["B0"]["AC"]["MONO"]==0
          assert d["B0"]["RUN"]=="SELF=AC_TM_SOLVE(EQ_SELF);BODY=Run(SELF,Q,N,B)"
          assert d["B0"]["EQ"]=="x=AC_TM(EQ_x)"
          assert d["B0"]["U"]=="KERNEL_UPTM_AC"
          PY
          sh solution_0_kernel.sh "Bounded analytic continuation" 16 4 > /tmp/kernel_bound.out
          python3 - <<'PY'
          import json
          d=json.load(open("solution_0_kernel.clcert"))
          assert d["STATE"]=="BOUND"
          assert d["OP"]==d["ZE"]==0
          assert d["BUG"]==1
          PY
      - name: Verify Genesis deployment
        run: |
          test -s solution_0_genesis.sh
          test "$(wc -c < solution_0_uptm.sh)" -le 2048
          sh solution_0_genesis.sh "All particles as Turing field" 16 64 > /tmp/genesis.out
          test -s solution_0_uptm.body
          test -s solution_0_genesis.body
          python3 - <<'PY'
          import json
          g=json.load(open("solution_0_genesis.clcert"))
          u=json.load(open("solution_0_uptm.clcert"))
          assert g["P"]=="solution_0_genesis.sh"
          assert g["GENESIS"]==g["CT"]==g["OP"]==g["FIX"]==g["ABS"]==g["PCC"]==g["ZE"]==1
          assert g["BUG"]==0
          assert g["B0"]["RUN"]=="UPTM=Run(CORE,Q,N,B)"
          assert g["B0"]["CORE"][0]==1 and g["B0"]["CORE"][1]<=2048
          ct=g["B0"]["CT"]
          assert all(k in ct for k in ("AI","BIO","MEM","HEALTH","SDG","UNK"))
          assert min(ct.values())==1
          assert u["OP"]==u["FIX"]==u["ZE"]==1
          assert u["B0"]["RUN"]=="BODY=Run(SELF,Q,N,B)"
          PY
      - name: Verify analytic-continuation body
        run: |
          test -s solution_0_acbody.sh
          test "$(wc -c < solution_0_acbody.sh)" -le 2048
          sh solution_0_acbody.sh "Any solvable problem as analytic continuation" 16 64 > /tmp/acbody.out
          test -s solution_0_acbody.body
          test -s solution_0_acbody.clcert
          python3 - <<'PY'
          import json
          d=json.load(open("solution_0_acbody.clcert"))
          assert d["P"]=="solution_0_acbody.sh"
          assert d["STATE"]=="SOLVED"
          assert d["OP"]==d["FIX"]==d["ABS"]==d["PCC"]==d["ZE"]==1
          assert d["BUG"]==0
          assert d["B0"]["SELF"][0]==1
          assert d["B0"]["AC"]["MONO"]==0
          assert d["B0"]["RUN"]=="SELF=AC_TM_SOLVE(EQ_SELF)"
          assert d["B0"]["EQ"]=="x=AC_TM(EQ_x)"
          PY
